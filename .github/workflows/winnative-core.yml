name: core

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches: [winnative]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  SYNC_BRANCH: winnative
  NDK_VERSION: 27.3.13750724
  ABI: arm64-v8a
  PLATFORM: android-26

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winnative
          fetch-depth: 0
          submodules: recursive

      - name: Sync upstream
        id: sync
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          parent=$(gh repo view "$GITHUB_REPOSITORY" --json parent --jq 'if .parent then .parent.owner.login + "/" + .parent.name else "" end')
          if [ -z "$parent" ]; then
            echo "No upstream parent; building the branch as-is."
            exit 0
          fi
          branch=$(gh repo view "$parent" --json defaultBranchRef --jq .defaultBranchRef.name)
          echo "upstream $parent@$branch"
          git config user.name "winnative-ci"
          git config user.email "ci@winnative.dev"
          git remote add upstream "https://github.com/$parent.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/$parent.git"
          git fetch --no-tags upstream "$branch"
          before=$(git rev-parse HEAD)
          if ! git merge --no-edit "upstream/$branch"; then
            git merge --abort || git reset --hard "$before"
            echo "::warning::Upstream merge conflicts; $SYNC_BRANCH left untouched. Resolve by hand, then re-run."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Upstream trees can carry a nested submodule with no .gitmodules URL
          # (beetle-psx's deps/lightning/gnulib), which must not fail the sync.
          git submodule update --init --recursive || echo "::warning::submodule update incomplete"
          if ! git push origin "HEAD:$SYNC_BRANCH"; then
            git fetch --no-tags origin "$SYNC_BRANCH"
            if git merge --no-edit "origin/$SYNC_BRANCH" && git push origin "HEAD:$SYNC_BRANCH"; then
              echo "Re-merged a concurrent update to $SYNC_BRANCH."
            else
              git merge --abort || true
              echo "::warning::$SYNC_BRANCH moved during the run; skipping. The next run picks it up."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Merged $(git rev-list --count $before..$after) upstream commit(s)."

      - name: Has the source changed since the last release?
        id: src
        run: |
          # The last commit touching anything outside .github, so editing the
          # workflow never triggers a rebuild. Compared against the commit the
          # published release was built from: ARMSX2 and Dolphin do not compile
          # reproducibly, so comparing the built bytes cannot decide this on its
          # own -- an identical tree yields a different .so every time.
          src=$(git log -1 --format=%H -- . ':(exclude).github')
          prev=$(curl -sfL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/source.sha" | tr -d '[:space:]' || true)
          echo "source    $src"
          echo "published ${prev:-<none>}"
          echo "$src" > source.sha
          if [ "$src" = "$prev" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "This source has already been built and released; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install NDK
        if: steps.src.outputs.changed == 'true'
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        if: steps.src.outputs.changed == 'true'
        run: |
          "$NDK/ndk-build" -C "libretro/jni" APP_ABI="$ABI" APP_PLATFORM="$PLATFORM"  -j"$(nproc)"

      - name: Collect
        if: steps.src.outputs.changed == 'true'
        run: |
          mkdir -p dist
          so="$(find . -path "*libs/$ABI/*.so" | head -1)"
          if [ -z "$so" ]; then
            echo "no .so produced" >&2
            exit 1
          fi
          cp "$so" "dist/libsnes9x_libretro_android.so"
          ls -l dist

      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.changed == 'true'
        with:
          name: libsnes9x_libretro_android.so
          path: dist/*.so
          if-no-files-found: error

      - name: Publish release
        if: steps.src.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=0
          for f in dist/*.so; do
            name=$(basename "$f")
            prev=$(mktemp -d)/"$name"
            if gh release download latest --pattern "$name" --output "$prev" 2>/dev/null && cmp -s "$prev" "$f"; then
              echo "$name unchanged"
            else
              echo "$name changed"
              changed=1
            fi
          done
          if [ "$changed" = "0" ]; then
            echo "Every artifact is byte-identical to the published release; nothing to publish."
            exit 0
          fi
          tag="build-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "arm64-v8a build from ${GITHUB_SHA}"
          fi
          gh release upload "$tag" dist/*.so source.sha --clobber
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --title latest --notes "Rolling build."
          fi
          gh release upload latest dist/*.so source.sha --clobber
          gh release edit latest --notes "Rolling; newest immutable tag: $tag"
          echo "$tag"
